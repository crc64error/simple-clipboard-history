<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple Clipboard History Icon
     Wayfarer Works
     1024x1024 Master Icon Source

     Design Notes:
     - Clipboard with layered "history" effect
     - Clean, geometric design for scalability
     - Modify colors, shapes as needed
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradient for depth -->
    <linearGradient id="clipboardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (optional - remove if you want transparent) -->
  <rect width="1024" height="1024" fill="#F8F9FA" rx="180"/>

  <!-- History stack effect - back papers -->
  <g id="history-stack" opacity="0.4">
    <rect x="280" y="250" width="464" height="600" rx="12"
          fill="#357ABD" filter="url(#shadow)"/>
    <rect x="260" y="230" width="464" height="600" rx="12"
          fill="#4A90E2" filter="url(#shadow)"/>
  </g>

  <!-- Main clipboard -->
  <g id="main-clipboard" filter="url(#shadow)">
    <!-- Clipboard backing -->
    <rect x="240" y="210" width="544" height="680" rx="16"
          fill="url(#clipboardGradient)"/>

    <!-- Clipboard clip (top metal part) -->
    <g id="clip">
      <rect x="380" y="180" width="264" height="80" rx="12"
            fill="#5A5A5A"/>
      <rect x="400" y="190" width="224" height="60" rx="8"
            fill="#7A7A7A"/>
      <ellipse cx="512" cy="220" rx="20" ry="12" fill="#5A5A5A"/>
    </g>

    <!-- Paper on clipboard -->
    <rect x="300" y="300" width="424" height="520" rx="8"
          fill="url(#paperGradient)"/>

    <!-- Text lines representing clipboard content -->
    <g id="text-lines" stroke="#4A90E2" stroke-width="8" stroke-linecap="round">
      <line x1="360" y1="400" x2="580" y2="400"/>
      <line x1="360" y1="460" x2="640" y2="460"/>
      <line x1="360" y1="520" x2="620" y2="520"/>
      <line x1="360" y1="580" x2="560" y2="580"/>
    </g>

    <!-- History indicator - small clock/arrow icon -->
    <g id="history-icon" transform="translate(600, 700)">
      <circle cx="0" cy="0" r="60" fill="#357ABD"/>
      <path d="M -8,-30 L -8,0 L 20,0"
            stroke="#FFFFFF" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 30,-10 L 45,0 L 30,10"
            fill="#FFFFFF"/>
    </g>
  </g>

</svg>
